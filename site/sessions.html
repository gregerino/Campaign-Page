<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Log — Phandelver and Below</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
</head>
<body>
  <div class="page-bg"></div>

  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">Phandelver</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="sessions.html" data-i18n="nav.sessions">Session Log</a></li>
        <li><a href="npcs.html" data-i18n="nav.npcs">NPCs</a></li>
        <li><a href="locations.html" data-i18n="nav.locations">Locations</a></li>
        <li><a href="goals.html" data-i18n="nav.quests">Quests</a></li>
        <li><a href="factions.html" data-i18n="nav.factions">Factions</a></li>
      </ul>
      <div class="nav-right">
        <button class="lang-toggle" title="Byt till svenska">SV</button>
        <button class="nav-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="page-header">
      <h1 class="page-title" data-i18n="sessions.title">Session Log</h1>
      <p class="page-subtitle" data-i18n="sessions.subtitle">A journal of our travels through the Sword Coast</p>
    </div>

    <div class="content-area">
      <div class="search-bar">
        <input type="text" id="session-search" class="search-input" data-i18n-placeholder="sessions.search" placeholder="Search sessions...">
      </div>
      <div class="session-list" id="session-list"></div>
    </div>
  </main>

  <footer class="main-footer" data-i18n="home.footer">A campaign chronicle from the Forgotten Realms — Phandalin, Sword Coast</footer>
  <button class="scroll-top" aria-label="Scroll to top">↑</button>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function renderSessions() {
      const container = document.getElementById('session-list');
      container.innerHTML = '';
      const sessions = CAMPAIGN.sessions.slice().reverse();

      const categoryConfig = [
        { key: 'where', icon: '🗺️', i18nKey: 'cat.where' },
        { key: 'who',   icon: '👤', i18nKey: 'cat.who' },
        { key: 'what',  icon: '⚔️', i18nKey: 'cat.what' },
        { key: 'learned', icon: '📖', i18nKey: 'cat.learned' }
      ];

      sessions.forEach((s, idx) => {
        const isLatest = idx === 0;
        const entry = document.createElement('div');
        entry.className = `session-entry${isLatest ? ' open' : ''}`;

        // Use bilingual session text from i18n.js
        const st = getSessionText(s.id);

        let categoriesHTML = '';
        categoryConfig.forEach(cat => {
          const content = st ? st[cat.key] : s[cat.key];
          if (content) {
            // Prose: render as paragraphs, splitting on double-sentence boundaries
            const paragraphs = typeof content === 'string'
              ? content.split(/(?<=\.) (?=[A-ZÅÄÖ])/).reduce((acc, sentence, i) => {
                  const pIdx = Math.floor(i / 3);
                  acc[pIdx] = (acc[pIdx] || '') + (acc[pIdx] ? ' ' : '') + sentence;
                  return acc;
                }, [])
              : content;

            categoriesHTML += `
              <div class="session-category">
                <div class="category-header">
                  <span class="category-icon">${cat.icon}</span>
                  <span class="category-title">${t(cat.i18nKey)}</span>
                </div>
                <div class="session-prose">
                  ${Array.isArray(paragraphs)
                    ? paragraphs.map(p => `<p>${p}</p>`).join('')
                    : `<p>${paragraphs}</p>`}
                </div>
              </div>`;
          }
        });

        const goalText = st ? st.goal : s.goal;
        const goalHTML = goalText ? `
          <div class="session-goal-box">
            <div class="category-header">
              <span class="category-icon">🎯</span>
              <span class="category-title">${t('cat.goal')}</span>
            </div>
            <div class="session-goal-text">${goalText}</div>
          </div>` : '';

        entry.innerHTML = `
          <div class="session-header">
            <div class="session-header-left">
              <span class="session-number">S${s.id}</span>
              <div>
                <div class="session-title">${s.title}</div>
                <div class="session-date">${s.date}</div>
              </div>
            </div>
            <span class="session-toggle">▼</span>
          </div>
          <div class="session-body">
            <div class="session-content">
              ${categoriesHTML}
              ${goalHTML}
            </div>
          </div>`;

        container.appendChild(entry);
      });

      container.querySelectorAll('.session-header').forEach(header => {
        header.addEventListener('click', () => {
          header.closest('.session-entry').classList.toggle('open');
        });
      });
    }

    renderSessions();
    window.addEventListener('langchange', renderSessions);
  </script>
</body>
</html>
